; -------------------------------------------------------
; 1 Click DLSS 5 - OptiScaler Pre-Configuration
; Optimized for DLSS Neural Rendering (DLSS-NR)
; DO NOT EDIT unless you know what you are doing
; -------------------------------------------------------

[Upscalers]
; Force DLSS as the DX12 upscaler (routes FSR2/XeSS to DLSS-NR)
Dx12Upscaler=dlss
Dx11Upscaler=auto
VulkanUpscaler=auto

[FrameGen]
Enabled=auto

[Inputs]
; Hook all possible upscaler inputs for maximum compatibility
EnableDlssInputs=true
EnableXeSSInputs=true
EnableFsr2Inputs=true
EnableFsr3Inputs=true
EnableFfxInputs=true
UseFsr2Inputs=true
UseFsr3Inputs=true
UseFfxInputs=true

[DLSS]
Enabled=true
RenderPresetOverride=false

[Hooks]
HookD3D12=true
HookSL=true

[Menu]
; DISABLED - ReShade/RenoDX overlay handles the UI (Home key)
; This prevents double overlay conflict
OverlayMenu=false
DisableSplash=true

[Log]
; Minimal logging to avoid performance impact
LogLevel=0
LogToFile=false
